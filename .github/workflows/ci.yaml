name: "CI"

env:
  DOTENV_CONFIG_PATH: "./.env.example"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

# Least-privilege token scope: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  ci:
    services:
      # Label used to access the service container
      localfhenix:
        options: --name localfhenix
        image: ghcr.io/fhenixprotocol/fhenix-devnet:0.1.6
        ports:
          # Opens tcp port
          - 5000:5000
          - 6000:6000
          - 8545:8545
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out the repo"
        uses: "actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26"  # v3

      - name: "Install Pnpm"
        uses: "pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b"  # v2
        with:
          version: "8"

      - name: "Install Node.js"
        uses: "actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610"  # v3
        with:
          cache: "pnpm"
          node-version: "lts/*"

      - name: "Install the dependencies"
        run: "pnpm install"

      - name: "Lint the code"
        run: "pnpm lint"

      - name: "Add lint summary"
        run: |
          echo "## Lint results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Passed" >> $GITHUB_STEP_SUMMARY

      - name: "Compile the contracts and generate the TypeChain bindings"
        run: "pnpm typechain"

#      - name: "Test the contracts"
#        run: "pnpm test"

      - name: "Add test summary"
        run: |
          echo "## Test results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Passed" >> $GITHUB_STEP_SUMMARY
